      <stop offset="0.45" stop-color="#0A121C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#060A11" stop-opacity="0.70"/>
    </linearGradient>
    <radialGradient id="li-glassCyan" cx="50" cy="13" r="234" gradientUnits="userSpaceOnUse">
