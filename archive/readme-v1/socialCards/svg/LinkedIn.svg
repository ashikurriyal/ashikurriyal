    <rect x="1" y="1" width="398" height="110" fill="url(#li-glassCyan)"/>
    <rect x="1" y="1" width="398" height="110" fill="url(#li-markGlow)"/>
    <rect x="1" y="1" width="398" height="110" fill="url(#li-glassSheen)"/>
    <rect x="1" y="1" width="398" height="110" fill="url(#li-refract)"/>
    <rect x="1" y="2.2" width="398" height="1.2" fill="url(#li-topEdge)"/>
  </g>

  <rect x="1.8" y="1.8" width="396.4" height="108.4" rx="22" fill="none" stroke="url(#li-borderGrad)" stroke-width="1.6"/>
  <rect x="4.3" y="4.3" width="389.4" height="103.4" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>

  <!-- traveling edge light: bloom copy then crisp, both on the same dash cycle -->
  <rect class="li-trace" x="1" y="1" width="398" height="110" rx="22" fill="none"
