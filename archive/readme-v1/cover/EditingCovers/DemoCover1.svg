<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
    <title id="t">Molla Ashikur Rahman — Frontend Engineer</title>
    <desc id="d">Dark developer profile banner: two flowing cyan wave currents crossing behind a frosted glass identity card.</desc>

    <defs>
        <!-- ===================== BACKGROUND ===================== -->
        <linearGradient id="bgBase" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0B1621" />
            <stop offset="0.55" stop-color="#080D14" />
            <stop offset="1" stop-color="#070B11" />
        </linearGradient>

        <radialGradient id="ambCyan" cx="430" cy="150" r="580" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22" />
            <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="ambSky" cx="1320" cy="520" r="620" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#38BDF8" stop-opacity="0.20" />
            <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="ambTeal" cx="760" cy="930" r="540" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#14B8A6" stop-opacity="0.14" />
            <stop offset="1" stop-color="#14B8A6" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="ambWide" cx="960" cy="540" r="1150" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.055" />
            <stop offset="1" stop-color="#0EA5E9" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="vignette" cx="960" cy="540" r="1180" gradientUnits="userSpaceOnUse">
            <stop offset="0.55" stop-color="#000000" stop-opacity="0" />
            <stop offset="1" stop-color="#000000" stop-opacity="0.55" />
        </radialGradient>

        <!-- ===================== WAVE STROKES ===================== -->
        <linearGradient id="gradA" x1="-160" y1="20" x2="1700" y2="800" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.16" />
            <stop offset="0.12" stop-color="#38BDF8" stop-opacity="0.88" />
            <stop offset="0.26" stop-color="#67E8F9" stop-opacity="1" />
            <stop offset="0.42" stop-color="#22D3EE" stop-opacity="0.92" />
            <stop offset="0.62" stop-color="#0EA5E9" stop-opacity="0.58" />
            <stop offset="0.82" stop-color="#14B8A6" stop-opacity="0.28" />
            <stop offset="1" stop-color="#0D9488" stop-opacity="0.05" />
        </linearGradient>
        <linearGradient id="gradAHi" x1="-160" y1="20" x2="1700" y2="800" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.15" />
            <stop offset="0.14" stop-color="#A5F3FC" stop-opacity="0.85" />
            <stop offset="0.28" stop-color="#E0FDFF" stop-opacity="1" />
            <stop offset="0.44" stop-color="#67E8F9" stop-opacity="0.75" />
            <stop offset="0.66" stop-color="#22D3EE" stop-opacity="0.35" />
            <stop offset="1" stop-color="#14B8A6" stop-opacity="0.02" />
        </linearGradient>
        <linearGradient id="gradB" x1="2080" y1="455" x2="-160" y2="1243" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#14B8A6" stop-opacity="0.10" />
            <stop offset="0.10" stop-color="#0EA5E9" stop-opacity="0.60" />
            <stop offset="0.24" stop-color="#38BDF8" stop-opacity="1" />
            <stop offset="0.38" stop-color="#67E8F9" stop-opacity="1" />
            <stop offset="0.56" stop-color="#22D3EE" stop-opacity="0.84" />
            <stop offset="0.78" stop-color="#0EA5E9" stop-opacity="0.42" />
            <stop offset="1" stop-color="#0D9488" stop-opacity="0.05" />
        </linearGradient>
        <linearGradient id="gradBHi" x1="2080" y1="455" x2="-160" y2="1243" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.08" />
            <stop offset="0.14" stop-color="#A5F3FC" stop-opacity="0.75" />
            <stop offset="0.32" stop-color="#E0FDFF" stop-opacity="1" />
            <stop offset="0.50" stop-color="#67E8F9" stop-opacity="0.70" />
            <stop offset="0.72" stop-color="#22D3EE" stop-opacity="0.28" />
            <stop offset="1" stop-color="#14B8A6" stop-opacity="0.02" />
        </linearGradient>

        <!-- ===================== GLASS CARD ===================== -->
        <linearGradient id="glassFill" x1="431" y1="231" x2="1488" y2="850" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#1A2636" stop-opacity="0.46" />
            <stop offset="0.45" stop-color="#101A28" stop-opacity="0.38" />
            <stop offset="1" stop-color="#090F18" stop-opacity="0.52" />
        </linearGradient>
        <linearGradient id="glassSheen" x1="431" y1="231" x2="1150" y2="850" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10" />
            <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.028" />
            <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0" />
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.018" />
        </linearGradient>
        <radialGradient id="glassCyan" cx="560" cy="300" r="620" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#67E8F9" stop-opacity="0.11" />
            <stop offset="1" stop-color="#67E8F9" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="cardBorder" x1="431" y1="231" x2="1488" y2="850" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55" />
            <stop offset="0.22" stop-color="#67E8F9" stop-opacity="0.72" />
            <stop offset="0.50" stop-color="#22D3EE" stop-opacity="0.42" />
            <stop offset="0.76" stop-color="#14B8A6" stop-opacity="0.52" />
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.30" />
        </linearGradient>
        <linearGradient id="topEdge" x1="431" y1="231" x2="1488" y2="231" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
            <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.22" />
            <stop offset="0.70" stop-color="#FFFFFF" stop-opacity="0.10" />
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>

        <!-- ===================== FILTERS ===================== -->
        <filter id="frost" x="-15%" y="-25%" width="130%" height="150%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="17" />
        </filter>
        <filter id="bloom" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="13" />
        </filter>
        <filter id="haze" x="-25%" y="-50%" width="150%" height="200%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="34" />
        </filter>
        <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="30" />
        </filter>

        <!-- ===================== GEOMETRY ===================== -->
        <clipPath id="cardClip">
            <rect x="431" y="231" width="1057" height="619" rx="26" />
        </clipPath>
        <mask id="outsideCard" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
            <rect width="1920" height="1080" fill="#FFFFFF" />
            <rect x="431" y="231" width="1057" height="619" rx="26" fill="#000000" />
        </mask>

        <!-- Wave A — enters beyond the upper-left, spreads and bends toward centre -->
        <g id="waveA" fill="none" stroke="url(#gradA)" stroke-linecap="round">
            <path d="M -160,18 C 180,66 430,143 720,233 C 1010,318 1320,370 1700,398" stroke-width="1.5" opacity="0.46" />
            <path d="M -160,30 C 180,78 430,163 720,260 C 1010,352 1320,410 1700,444" stroke-width="1.7" opacity="0.60" />
            <path d="M -160,42 C 180,90 430,183 720,287 C 1010,386 1320,450 1700,490" stroke-width="2.0" opacity="0.74" />
            <path d="M -160,54 C 180,102 430,203 720,314 C 1010,420 1320,490 1700,536" stroke-width="2.2" opacity="0.82" />
            <path d="M -160,66 C 180,114 430,223 720,341 C 1010,454 1320,530 1700,582" stroke-width="2.4" opacity="0.90" />
            <path d="M -160,78 C 180,126 430,243 720,368 C 1010,488 1320,570 1700,628" stroke-width="2.3" opacity="0.86" />
            <path d="M -160,90 C 180,138 430,263 720,395 C 1010,522 1320,610 1700,674" stroke-width="2.1" opacity="0.76" />
            <path d="M -160,102 C 180,150 430,283 720,422 C 1010,556 1320,650 1700,720" stroke-width="1.9" opacity="0.64" />
            <path d="M -160,114 C 180,162 430,303 720,449 C 1010,590 1320,690 1700,766" stroke-width="1.7" opacity="0.52" />
            <path d="M -160,126 C 180,174 430,323 720,476 C 1010,624 1320,730 1700,812" stroke-width="1.5" opacity="0.38" />
        </g>
        <g id="waveAHi" fill="none" stroke="url(#gradAHi)" stroke-linecap="round">
            <path d="M -160,46 C 180,94 430,188 720,294 C 1010,394 1320,460 1700,500" stroke-width="3.2" />
            <path d="M -160,82 C 180,130 430,248 720,375 C 1010,496 1320,580 1700,640" stroke-width="2.6" opacity="0.8" />
        </g>

        <!-- Wave B — emerges beyond the lower-right, sweeps back across the floor -->
        <g id="waveB" fill="none" stroke="url(#gradB)" stroke-linecap="round">
            <path d="M 2080,455 C 1740,501 1480,575 1190,663 C 900,747 590,799 -160,829" stroke-width="1.5" opacity="0.46" />
            <path d="M 2080,467 C 1740,513 1480,595 1190,690 C 900,781 590,839 -160,875" stroke-width="1.7" opacity="0.60" />
            <path d="M 2080,479 C 1740,525 1480,615 1190,717 C 900,815 590,879 -160,921" stroke-width="2.0" opacity="0.74" />
            <path d="M 2080,491 C 1740,537 1480,635 1190,744 C 900,849 590,919 -160,967" stroke-width="2.2" opacity="0.84" />
            <path d="M 2080,503 C 1740,549 1480,655 1190,771 C 900,883 590,959 -160,1013" stroke-width="2.4" opacity="0.90" />
            <path d="M 2080,515 C 1740,561 1480,675 1190,798 C 900,917 590,999 -160,1059" stroke-width="2.3" opacity="0.84" />
            <path d="M 2080,527 C 1740,573 1480,695 1190,825 C 900,951 590,1039 -160,1105" stroke-width="2.1" opacity="0.74" />
            <path d="M 2080,539 C 1740,585 1480,715 1190,852 C 900,985 590,1079 -160,1151" stroke-width="1.9" opacity="0.62" />
            <path d="M 2080,551 C 1740,597 1480,735 1190,879 C 900,1019 590,1119 -160,1197" stroke-width="1.7" opacity="0.50" />
            <path d="M 2080,563 C 1740,609 1480,755 1190,906 C 900,1053 590,1159 -160,1243" stroke-width="1.5" opacity="0.36" />
        </g>
        <g id="waveBHi" fill="none" stroke="url(#gradBHi)" stroke-linecap="round">
            <path d="M 2080,483 C 1740,529 1480,620 1190,724 C 900,823 590,889 -160,933" stroke-width="3.2" />
            <path d="M 2080,519 C 1740,565 1480,680 1190,805 C 900,925 590,1009 -160,1071" stroke-width="2.6" opacity="0.8" />
        </g>
    </defs>

    <style>
        text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        .wave  { animation: waveCycle 16s cubic-bezier(.45,0,.25,1) infinite; }
        .hi    { animation: hiCycle   16s cubic-bezier(.45,0,.25,1) infinite; }
        .amb   { animation: ambCycle  16s cubic-bezier(.45,0,.25,1) infinite; }
        .driftA { animation: driftA 16s ease-in-out infinite; }
        .driftB { animation: driftB 16s ease-in-out infinite; }

        /* 16s loop — 0-5s fade in · 5-11s peak · 11-15s fade out · 15-16s near black */
        @keyframes waveCycle {
            0%      { opacity: .02; }
            31.25%  { opacity: 1; }
            50%     { opacity: .88; }
            68.75%  { opacity: 1; }
            93.75%  { opacity: .02; }
            100%    { opacity: .02; }
        }
        @keyframes hiCycle {
            0%      { opacity: 0; }
            34%     { opacity: 1; }
            52%     { opacity: .76; }
            70%     { opacity: 1; }
            92%     { opacity: 0; }
            100%    { opacity: 0; }
        }
        @keyframes ambCycle {
            0%      { opacity: .02; }
            33%     { opacity: 1; }
            50%     { opacity: .82; }
            69%     { opacity: .96; }
            93.75%  { opacity: .02; }
            100%    { opacity: .02; }
        }
        @keyframes driftA {
            0%   { transform: translate(0px, 0px); }
            50%  { transform: translate(24px, 16px); }
            100% { transform: translate(0px, 0px); }
        }
        @keyframes driftB {
            0%   { transform: translate(0px, 0px); }
            50%  { transform: translate(-22px, -14px); }
            100% { transform: translate(0px, 0px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .wave, .hi, .amb, .driftA, .driftB { animation: none; }
        }
    </style>

    <!-- ===================== BACKGROUND ===================== -->
    <rect width="1920" height="1080" fill="#080D14" />
    <rect width="1920" height="1080" fill="url(#bgBase)" />

    <g class="amb">
        <rect width="1920" height="1080" fill="url(#ambWide)" />
        <rect width="1920" height="1080" fill="url(#ambCyan)" />
        <rect width="1920" height="1080" fill="url(#ambSky)" />
        <rect width="1920" height="1080" fill="url(#ambTeal)" />
    </g>

    <!-- ===================== WAVE FIELD (outside the glass) ===================== -->
    <g mask="url(#outsideCard)">
        <g class="wave" opacity="0.40">
            <g class="driftA"><use href="#waveA" filter="url(#haze)" /></g>
            <g class="driftB"><use href="#waveB" filter="url(#haze)" /></g>
        </g>
        <g class="hi" opacity="0.9">
            <g class="driftA"><use href="#waveAHi" filter="url(#bloom)" /></g>
            <g class="driftB"><use href="#waveBHi" filter="url(#bloom)" /></g>
        </g>
        <g class="wave">
            <g class="driftA"><use href="#waveA" /></g>
            <g class="driftB"><use href="#waveB" /></g>
        </g>
        <g class="hi">
            <g class="driftA"><use href="#waveAHi" /></g>
            <g class="driftB"><use href="#waveBHi" /></g>
        </g>
    </g>

    <rect width="1920" height="1080" fill="url(#vignette)" />

    <!-- ===================== GLASS CARD ===================== -->
    <rect x="447" y="259" width="1025" height="603" rx="26" fill="#000000" opacity="0.5" filter="url(#shadow)" />

    <g clip-path="url(#cardClip)">
        <!-- refracted wave seen through frosted glass -->
        <g opacity="0.88" filter="url(#frost)">
            <g class="wave">
                <g class="driftA"><use href="#waveA" /></g>
                <g class="driftB"><use href="#waveB" /></g>
            </g>
            <g class="hi">
                <g class="driftA"><use href="#waveAHi" /></g>
                <g class="driftB"><use href="#waveBHi" /></g>
            </g>
        </g>

        <rect x="431" y="231" width="1057" height="619" fill="url(#glassFill)" />
        <rect x="431" y="231" width="1057" height="619" fill="url(#glassCyan)" />
        <rect x="431" y="231" width="1057" height="619" fill="url(#glassSheen)" />

        <!-- monogram watermark, clipped by the rounded boundary -->
        <path transform="translate(1122,676) scale(0.52,-0.52)" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="5"
            d="M275 417H312Q370 417 401.0 441.0Q432 465 432 510Q432 555 401.0 579.0Q370 603 312 603H275ZM706 0H462L275 290V0H79V754H384Q447 754 494.0 735.5Q541 717 571.5 685.0Q602 653 617.5 611.0Q633 569 633 521Q633 435 591.5 381.5Q550 328 469 309Z" />

        <rect x="431" y="232.2" width="1057" height="1.2" fill="url(#topEdge)" />
    </g>

    <rect x="431.9" y="231.9" width="1055.2" height="617.2" rx="25.1" fill="none" stroke="url(#cardBorder)" stroke-width="1.8" />

    <!-- ===================== CARD CONTENT ===================== -->
    <text x="496" y="362" font-size="52" font-weight="800" letter-spacing="1.6" fill="#FFFFFF" fill-opacity="0.96">MOLLA ASHIKUR RAHMAN</text>
    <text x="498" y="424" font-size="31" font-weight="500" letter-spacing="0.6" fill="#38BDF8">Frontend Engineer</text>

    <!-- email -->
    <g transform="translate(496,502) scale(0.0547)" fill="#E2E8F0" fill-opacity="0.80">
        <path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48H48zM0 176V384c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z" />
    </g>
    <text x="540" y="525" font-size="26" letter-spacing="0.3" fill="#E2E8F0" fill-opacity="0.88">riyalashikur@gmail.com</text>

    <!-- linkedin -->
    <g transform="translate(497,567) scale(0.058)" fill="#E2E8F0" fill-opacity="0.80">
        <path d="M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 0 1 107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.88-48.3 94 0 111.28 61.9 111.28 142.3V448z" />
    </g>
    <text x="540" y="589" font-size="26" letter-spacing="0.3" fill="#E2E8F0" fill-opacity="0.88">www.linkedin.com/in/riyalashikur</text>

    <!-- tech stack badges -->
    <g opacity="0.88">
        <g transform="translate(524,700)" fill="none" stroke="#38BDF8" stroke-width="2.2">
            <circle r="5.2" fill="#38BDF8" stroke="none" />
            <ellipse rx="22" ry="8.4" />
            <ellipse rx="22" ry="8.4" transform="rotate(60)" />
            <ellipse rx="22" ry="8.4" transform="rotate(120)" />
        </g>
        <g>
            <rect x="570" y="676" width="48" height="48" rx="11" fill="#F7DF1E" fill-opacity="0.85" />
            <text x="594" y="709" font-size="23" font-weight="700" text-anchor="middle" fill="#0B1220">JS</text>
        </g>
        <g transform="translate(638,674) scale(2.167)" fill="#38BDF8">
            <path d="M12 6C9.33 6 7.67 7.33 7 10c1-1.33 2.17-1.83 3.5-1.5.76.19 1.31.74 1.91 1.35C13.39 10.85 14.5 12 17 12c2.67 0 4.33-1.33 5-4-1 1.33-2.17 1.83-3.5 1.5-.76-.19-1.3-.74-1.91-1.35C15.61 7.15 14.5 6 12 6zM7 12c-2.67 0-4.33 1.33-5 4 1-1.33 2.17-1.83 3.5-1.5.76.19 1.3.74 1.91 1.35C8.39 16.85 9.5 18 12 18c2.67 0 4.33-1.33 5-4-1 1.33-2.17 1.83-3.5 1.5-.76-.19-1.31-.74-1.91-1.35C10.61 13.15 9.5 12 7 12z" />
        </g>
    </g>
</svg>
