<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 112" width="400" height="112" role="img" aria-labelledby="gm-t">
  <title id="gm-t">Gmail — riyalashikur@gmail.com</title>
  <defs>
    <linearGradient id="gm-base" x1="0" y1="0" x2="400" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1621"/><stop offset="0.55" stop-color="#080D14"/><stop offset="1" stop-color="#070B11"/>
    </linearGradient>
    <linearGradient id="gm-glassFill" x1="1" y1="1" x2="399" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101A28" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#0A121C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#060A11" stop-opacity="0.70"/>
    </linearGradient>
    <radialGradient id="gm-glassCyan" cx="50" cy="13" r="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.16"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gm-glassSheen" x1="1" y1="1" x2="272" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.028"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.018"/>
    </linearGradient>
    <linearGradient id="gm-refract" x1="1" y1="111" x2="399" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0.34" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.56" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gm-borderGrad" x1="1" y1="1" x2="399" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#67E8F9" stop-opacity="1.00"/>
      <stop offset="0.45" stop-color="#22D3EE" stop-opacity="0.72"/>
      <stop offset="0.72" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="gm-traceGrad" x1="1" y1="1" x2="399" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A5F3FC" stop-opacity="1"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gm-dividerGrad" x1="0" y1="34" x2="0" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gm-topEdge" x1="1" y1="1" x2="399" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.70" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gm-wave" x1="0" y1="0" x2="400" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="0.10" stop-color="#38BDF8" stop-opacity="0.72"/>
      <stop offset="0.22" stop-color="#67E8F9" stop-opacity="1.00"/>
      <stop offset="0.34" stop-color="#22D3EE" stop-opacity="0.86"/>
      <stop offset="0.52" stop-color="#0EA5E9" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="gm-markGlow" cx="51" cy="56" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gm-mark" x1="26.0" y1="37.2" x2="76.0" y2="74.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="gm-edgeBloom" x="-25%" y="-40%" width="150%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/></filter>
    <filter id="gm-traceBloom" x="-25%" y="-40%" width="150%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/></filter>
    <filter id="gm-dividerBloom" x="-300%" y="-40%" width="700%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2"/></filter>
    <filter id="gm-shadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="gm-clip"><rect x="1" y="1" width="398" height="110" rx="22"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Inter', 'Geist', 'Manrope', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .gm-trace { stroke-dasharray: 110 868.23; animation: gm-trace 7s linear infinite; }
    @keyframes gm-trace { to { stroke-dashoffset: -978.23; } }
    @media (prefers-reduced-motion: reduce) { .gm-trace { animation: none; opacity: 0; } }
  </style>

  <rect x="7" y="7" width="386" height="100" rx="20" fill="#000000" opacity="0.5" filter="url(#gm-shadow)"/>
  <rect x="1.8" y="1.8" width="396.4" height="108.4" rx="22" fill="none"
        stroke="url(#gm-borderGrad)" stroke-width="3.5" filter="url(#gm-edgeBloom)" opacity="0.65"/>
  <rect x="1" y="1" width="398" height="110" rx="22" fill="url(#gm-base)"/>

  <g clip-path="url(#gm-clip)">
    <g fill="none" stroke="url(#gm-wave)" stroke-linecap="round" opacity="0.38">
      <path d="M -30,-6 C 63,10 158,21 253,37 C 316,48 368,68 430,92" stroke-width="1.2"/>
      <path d="M -30,-3 C 74,15 168,25 263,41 C 324,51 371,70 430,92" stroke-width="1.6"/>
      <path d="M -30,-18 C 53,-2 147,8 244,24 C 312,35 366,54 430,78" stroke-width="1.0"/>
    </g>
    <rect x="1" y="1" width="398" height="110" fill="url(#gm-glassFill)"/>
    <rect x="1" y="1" width="398" height="110" fill="url(#gm-glassCyan)"/>
    <rect x="1" y="1" width="398" height="110" fill="url(#gm-markGlow)"/>
    <rect x="1" y="1" width="398" height="110" fill="url(#gm-glassSheen)"/>
    <rect x="1" y="1" width="398" height="110" fill="url(#gm-refract)"/>
    <rect x="1" y="2.2" width="398" height="1.2" fill="url(#gm-topEdge)"/>
  </g>

  <rect x="1.8" y="1.8" width="396.4" height="108.4" rx="22" fill="none" stroke="url(#gm-borderGrad)" stroke-width="1.6"/>
  <rect x="4.3" y="4.3" width="389.4" height="103.4" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>

  <!-- traveling edge light: bloom copy then crisp, both on the same dash cycle -->
  <rect class="gm-trace" x="1" y="1" width="398" height="110" rx="22" fill="none"
        stroke="url(#gm-traceGrad)" stroke-width="5" stroke-linecap="round"
        filter="url(#gm-traceBloom)" opacity="0.6"/>
  <rect class="gm-trace" x="1" y="1" width="398" height="110" rx="22" fill="none"
        stroke="url(#gm-traceGrad)" stroke-width="2" stroke-linecap="round"/>

  <g transform="translate(26.000,31.000) scale(2.083333)" fill="url(#gm-mark)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></g>

  <line x1="100" y1="34" x2="100" y2="78" stroke="url(#gm-dividerGrad)" stroke-width="3"
        filter="url(#gm-dividerBloom)" opacity="0.45"/>
  <line x1="100" y1="34" x2="100" y2="78" stroke="url(#gm-dividerGrad)" stroke-width="1.6"/>

  <text x="122" y="50" font-size="22" font-weight="600" letter-spacing="0.2" fill="#F1F5F9">Gmail</text>
  <text x="122" y="76" font-size="15" font-weight="400" letter-spacing="0.15" fill="#94A3B8">riyalashikur@gmail.com</text>

  <g stroke="#67E8F9" stroke-opacity="0.90" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 363.7,61.6 L 374.9,50.4"/>
    <path d="M 367.6,50.4 L 374.9,50.4 L 374.9,57.7"/>
  </g>
</svg>
