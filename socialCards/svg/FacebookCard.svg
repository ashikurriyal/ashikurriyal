<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96" role="img" aria-label="Facebook">
  <title>Facebook</title>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="320" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E1B27"/><stop offset="0.55" stop-color="#0A121C"/><stop offset="1" stop-color="#080E16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="320" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="0.25" stop-color="#67E8F9" stop-opacity="0.62"/>
      <stop offset="0.60" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="224.0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.012"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lift" cx="70" cy="18" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.10"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brandglow" cx="54" cy="48" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1877F2" stop-opacity="0.26"/><stop offset="1" stop-color="#1877F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="35.0" y1="29.0" x2="73.0" y2="67.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BA3FF"/><stop offset="1" stop-color="#1877F2"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="96" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="clip"><rect width="320" height="96" rx="18"/></clipPath>
  </defs>

  <rect width="320" height="96" rx="18" fill="url(#surface)"/>
  <g clip-path="url(#clip)">
    <!-- wave accent, echoing the cover banner -->
    <g fill="none" stroke="url(#wave)" stroke-linecap="round">
      <path d="M -20,108 C 60,86 120,96 190,70 C 250,48 290,40 350,16" stroke-width="1.5" opacity="0.75"/>
      <path d="M -20,122 C 70,98 130,110 200,82 C 262,58 300,50 350,28" stroke-width="2.1"/>
      <path d="M -20,136 C 80,112 140,124 212,94 C 274,70 310,62 350,42" stroke-width="1.3" opacity="0.6"/>
    </g>
    <rect width="320" height="96" fill="url(#lift)"/>
    <rect width="320" height="96" fill="url(#brandglow)"/>
    <rect width="320" height="96" fill="url(#sheen)"/>
  </g>
  <rect x="0.75" y="0.75" width="318.5" height="94.5" rx="17.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <g transform="translate(42.92,29.00) scale(0.07422)" fill="url(#mark)">
    <path d="M80 299.3V512h116V299.3h86.5l18-97.8H196v-33.3c0-51.8 20.3-71.5 72.7-71.5 16.3 0 29.4.4 37 1.2V9.8C291.4 4.4 262.3 0 245.4 0 138.7 0 89.7 50.4 89.7 159.9v41.5H16v97.8h64z"/>
  </g>
  <text x="96" y="59" font-family="'Inter','Geist','Manrope','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="30" font-weight="600" letter-spacing="0.2" fill="#E2E8F0">Facebook</text>
</svg>
