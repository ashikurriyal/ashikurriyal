<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 92" width="272" height="92" role="img" aria-labelledby="gm-title">
  <title id="gm-title">Email — riyalashikur@gmail.com</title>
  <defs>
    <clipPath id="gm-card"><rect x="0.5" y="0.5" width="271" height="91" rx="13.5"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .caret { animation: blink 1s steps(1) infinite; }
    .nudge { animation: nudge 1.6s cubic-bezier(.16, 1, .3, 1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes nudge { 0%, 60%, 100% { transform: translate(0, 0); } 30% { transform: translate(2px, -2px); } }
    @media (prefers-reduced-motion: reduce) { .caret, .nudge { animation: none; } }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="271" height="91" rx="13.5" fill="#021716"/>
  <g clip-path="url(#gm-card)">
    <rect width="272" height="28" fill="#03201F"/>
    <rect y="28" width="272" height="1" fill="#CCFBF1" fill-opacity="0.09"/>
  </g>
  <rect x="0.5" y="0.5" width="271" height="91" rx="13.5" fill="none" stroke="#CCFBF1" stroke-opacity="0.17"/>

  <!-- title bar -->
  <circle cx="15.5" cy="14" r="3.5" fill="#0F4A46"/>
  <circle cx="28.5" cy="14" r="3.5" fill="#0F4A46"/>
  <circle cx="41.5" cy="14" r="3.5" fill="#2DD4BF"/>
  <text x="52" y="17.5" font-size="10.5" fill="#7FB8B0">~/gmail</text>
  <g transform="translate(248 8) scale(0.5)">
    <g class="nudge" fill="none" stroke="#7FB8B0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 17L17 7"/>
      <path d="M8 7h9v9"/>
    </g>
  </g>

  <!-- body -->
  <rect x="14.5" y="42.5" width="35" height="35" rx="8.5" fill="#042F2E" stroke="#CCFBF1" stroke-opacity="0.17"/>
  <g transform="translate(22.5 50.5) scale(0.7917)" fill="#2DD4BF">
    <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/>
  </g>
  <text x="62" y="56" font-size="11.5" fill="#7FB8B0"><tspan fill="#2DD4BF">$</tspan> mail --to</text>
  <text x="62" y="74" font-size="13" font-weight="600" fill="#F0FDFA">riyalashikur@gmail.com<tspan class="caret" fill="#2DD4BF">▍</tspan></text>
