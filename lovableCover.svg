<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Base & Glow Gradients -->
    <radialGradient id="canvasBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <!-- Deep Ambient Glow Orbs -->
    <radialGradient id="auroraCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Card Surface -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070c18" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.65"/>
    </linearGradient>

    <!-- High-End Watermark R Gradient -->
    <linearGradient id="watermarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="watermarkInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Headline Gradients -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Stack Chip Background -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Wave Splines -->
    <linearGradient id="waveStroke1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveStroke2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="44" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>

    <!-- Clip Path for Inside the Glass Card -->
    <clipPath id="cardClip">
      <rect x="431.5" y="230.5" width="1057" height="619" rx="32"/>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');

    text {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .font-name {
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .font-title {
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .font-meta {
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    /* Ambient Motion Background Keyframes */
    @keyframes driftOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(140px, 80px) scale(1.18); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes driftOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-120px, -90px) scale(1.22); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes driftOrb3 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(90px, -60px) scale(1.15); opacity: 0.55; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
    }
    @keyframes flowWave1 {
      0% { stroke-dashoffset: 0; transform: translateY(0px); }
      50% { stroke-dashoffset: 160; transform: translateY(-14px); }
      100% { stroke-dashoffset: 320; transform: translateY(0px); }
    }
    @keyframes flowWave2 {
      0% { stroke-dashoffset: 0; transform: translateY(0px); }
      50% { stroke-dashoffset: -140; transform: translateY(16px); }
      100% { stroke-dashoffset: -280; transform: translateY(0px); }
    }
    @keyframes cardFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    @keyframes watermarkBreathe {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    .orb-1 {
      animation: driftOrb1 20s ease-in-out infinite;
      transform-origin: 350px 250px;
    }
    .orb-2 {
      animation: driftOrb2 24s ease-in-out infinite;
      transform-origin: 1550px 850px;
    }
    .orb-3 {
      animation: driftOrb3 18s ease-in-out infinite;
      transform-origin: 1450px 220px;
    }
    .wave-1 {
      stroke-dasharray: 220 45;
      animation: flowWave1 15s ease-in-out infinite;
    }
    .wave-2 {
      stroke-dasharray: 190 35;
      animation: flowWave2 18s ease-in-out infinite;
    }
    .floating-card {
      animation: cardFloat 9s ease-in-out infinite;
      transform-origin: 960px 540px;
    }
    .shimmer-border {
      animation: pulseGlow 5s ease-in-out infinite;
    }
    .watermark-group {
      animation: watermarkBreathe 8s ease-in-out infinite;
      transform-origin: 1200px 500px;
    }
  </style>

  <!-- ================= CANVAS BACKGROUND ================= -->
  <rect width="1920" height="1080" fill="url(#canvasBg)"/>

  <!-- Ambient Animated Glowing Orbs -->
  <g id="ambientOrbs">
    <circle class="orb-1" cx="360" cy="240" r="520" fill="url(#auroraCyan)"/>
    <circle class="orb-2" cx="1560" cy="840" r="560" fill="url(#auroraViolet)"/>
    <circle class="orb-3" cx="1440" cy="240" r="460" fill="url(#auroraPurple)"/>
  </g>

  <!-- Minimal Decorative Tech Matrix -->
  <g opacity="0.09" fill="#94a3b8">
    <circle cx="220" cy="160" r="2"/><circle cx="300" cy="160" r="2"/><circle cx="380" cy="160" r="2"/>
    <circle cx="220" cy="240" r="2"/><circle cx="300" cy="240" r="2"/><circle cx="380" cy="240" r="2"/>
    <circle cx="220" cy="320" r="2"/><circle cx="300" cy="320" r="2"/><circle cx="380" cy="320" r="2"/>
    
    <circle cx="1540" cy="760" r="2"/><circle cx="1620" cy="760" r="2"/><circle cx="1700" cy="760" r="2"/>
    <circle cx="1540" cy="840" r="2"/><circle cx="1620" cy="840" r="2"/><circle cx="1700" cy="840" r="2"/>
    <circle cx="1540" cy="920" r="2"/><circle cx="1620" cy="920" r="2"/><circle cx="1700" cy="920" r="2"/>
  </g>

  <!-- Flowing Motion Ribbons -->
  <g opacity="0.65" fill="none" stroke-linecap="round">
    <path class="wave-1" d="M 80,1020 C 440,780 800,940 1220,680 C 1540,490 1700,220 1920,100" stroke="url(#waveStroke1)" stroke-width="2.5"/>
    <path class="wave-2" d="M 20,850 C 400,640 840,800 1280,530 C 1600,340 1740,160 1940,30" stroke="url(#waveStroke2)" stroke-width="2"/>
    <path d="M 180,1060 C 540,840 920,960 1360,720 C 1640,560 1800,300 1960,200" stroke="url(#waveStroke1)" stroke-width="1.2" opacity="0.35"/>
  </g>

  <!-- ================= FLOATING GLASS CARD ================= -->
  <g class="floating-card" filter="url(#cardShadow)">
    
    <!-- Base Frosted Glass Fill -->
    <rect x="431.5" y="230.5" width="1057" height="619" rx="32" fill="url(#glassSurface)"/>
    
    <!-- Inner Ambient Soft Refractions -->
    <rect x="431.5" y="230.5" width="1057" height="619" rx="32" fill="url(#auroraCyan)" opacity="0.35"/>
    <rect x="431.5" y="230.5" width="1057" height="619" rx="32" fill="url(#auroraViolet)" opacity="0.22"/>

    <!-- Content Clipped to Card Body -->
    <g clip-path="url(#cardClip)">
      
      <!-- Subtle Architectural Watermark "R" -->
      <g class="watermark-group" transform="translate(1010, 245)">
        <path d="M 90,60 L 90,520" stroke="url(#watermarkGrad)" stroke-width="20" stroke-linecap="round"/>
        <path d="M 80,90 C 220,90 350,110 350,230 C 350,340 230,370 90,370" fill="none" stroke="url(#watermarkGrad)" stroke-width="20" stroke-linecap="round"/>
        <path d="M 190,370 L 350,520" stroke="url(#watermarkGrad)" stroke-width="24" stroke-linecap="round"/>
        
        <path d="M 130,100 L 130,480" stroke="url(#watermarkInner)" stroke-width="3" stroke-linecap="round"/>
        <path d="M 120,130 C 220,130 305,145 305,230 C 305,305 230,325 130,325" fill="none" stroke="url(#watermarkInner)" stroke-width="3" stroke-linecap="round"/>
        <path d="M 195,330 L 315,480" stroke="url(#watermarkInner)" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Internal Card Curves -->
      <path d="M 431.5,580 C 680,540 880,410 1120,380 C 1320,350 1420,280 1488.5,230.5" fill="none" stroke="url(#waveStroke1)" stroke-width="1.2" opacity="0.35"/>
      <path d="M 431.5,680 C 720,640 940,510 1200,480 C 1380,460 1440,380 1488.5,310" fill="none" stroke="url(#waveStroke2)" stroke-width="1" opacity="0.25"/>

      <!-- Headline: Full Name & Job Title -->
      <g transform="translate(515, 395)">
        <text x="0" y="0" class="font-name" font-size="52" fill="url(#nameGradient)">Molla Ashikur Rahman</text>
        <text x="2" y="52" class="font-title" font-size="28" fill="url(#titleGradient)">Frontend Engineer</text>
      </g>

      <line x1="515" y1="535" x2="1405" y2="535" stroke="#334155" stroke-opacity="0.4" stroke-dasharray="6 6"/>

      <!-- Footer: Contacts (Email, LinkedIn, GitHub) -->
      <g transform="translate(515, 605)">
        <!-- Email -->
        <g transform="translate(0, 0)">
          <g fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="0" y="0" width="22" height="16" rx="4"/>
            <path d="M 0,2.5 L 11,10.5 L 22,2.5"/>
          </g>
          <text x="36" y="13" class="font-meta" font-size="16" fill="#cbd5e1">riyalashikur@gmail.com</text>
        </g>

        <!-- LinkedIn -->
        <g transform="translate(0, 42)">
          <g fill="#38bdf8">
            <path d="M 2.2,0 C 1,0 0,1 0,2.2 L 0,17.8 C 0,19 1,20 2.2,20 L 17.8,20 C 19,20 20,19 20,17.8 L 20,2.2 C 20,1 19,0 17.8,0 L 2.2,0 Z M 5.9,17 L 3,17 L 3,7.5 L 5.9,7.5 L 5.9,17 Z M 4.4,6.2 C 3.4,6.2 2.7,5.5 2.7,4.5 C 2.7,3.6 3.4,2.9 4.4,2.9 C 5.3,2.9 6.1,3.6 6.1,4.5 C 6.1,5.5 5.3,6.2 4.4,6.2 Z M 17,17 L 14.1,17 L 14.1,12.3 C 14.1,11.2 14.1,9.8 12.6,9.8 C 11,9.8 10.8,11 10.8,12.2 L 10.8,17 L 7.9,17 L 7.9,7.5 L 10.7,7.5 L 10.7,8.8 L 10.7,8.8 C 11.1,8.1 12,7.3 13.4,7.3 C 16.3,7.3 17,9.2 17,11.8 L 17,17 Z"/>
          </g>
          <text x="36" y="15" class="font-meta" font-size="16" fill="#cbd5e1">www.linkedin.com/in/riyalashikur</text>
        </g>

        <!-- GitHub -->
        <g transform="translate(0, 84)">
          <g fill="#38bdf8">
            <path d="M 10,0 C 4.5,0 0,4.6 0,10.2 C 0,14.8 2.9,18.6 7,20 C 7.5,20.1 7.7,19.8 7.7,19.5 C 7.7,19.3 7.7,18.6 7.7,17.8 C 4.9,18.4 4.3,16.6 4.3,16.6 C 3.8,15.5 3.1,15.2 3.1,15.2 C 2.2,14.6 3.2,14.6 3.2,14.6 C 4.2,14.7 4.7,15.6 4.7,15.6 C 5.6,17.1 7.1,16.6 7.6,16.4 C 7.7,15.7 8,15.2 8.3,14.9 C 6.1,14.6 3.7,13.8 3.7,9.8 C 3.7,8.7 4.1,7.8 4.7,7.1 C 4.6,6.9 4.2,5.8 4.8,4.4 C 4.8,4.4 5.7,4.1 7.7,5.5 C 8.6,5.3 9.5,5.1 10.4,5.1 C 11.3,5.1 12.2,5.3 13.1,5.5 C 15.1,4.1 16,4.4 16,4.4 C 16.6,5.8 16.2,6.9 16.1,7.1 C 16.7,7.8 17.1,8.7 17.1,9.8 C 17.1,13.8 14.7,14.6 12.5,14.9 C 12.9,15.2 13.2,15.9 13.2,16.9 C 13.2,18.4 13.2,19.5 13.2,19.8 C 13.2,20.1 13.4,20.4 13.9,20.3 C 18,18.9 20.9,15 20.9,10.4 C 20.9,4.6 15.9,0 10,0 Z"/>
          </g>
          <text x="36" y="15" class="font-meta" font-size="16" fill="#cbd5e1">github.com/ashikurriyal</text>
        </g>
      </g>

      <!-- Footer: Tech Stack Badges (Next.js, React, TypeScript) -->
      <g transform="translate(1145, 620)">
        <!-- Next.js Tile -->
        <g transform="translate(0, 0)">
          <rect width="78" height="64" rx="14" fill="url(#chipBg)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
          <circle cx="39" cy="32" r="18" fill="#020617" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>
          <text x="39" y="39" class="font-name" font-size="18" fill="#ffffff" text-anchor="middle">N</text>
        </g>

        <!-- React Tile -->
        <g transform="translate(94, 0)">
          <rect width="78" height="64" rx="14" fill="url(#chipBg)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
          <g transform="translate(39, 32)">
            <ellipse rx="17" ry="6.5" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
            <ellipse rx="17" ry="6.5" fill="none" stroke="#38bdf8" stroke-width="1.4" transform="rotate(60)"/>
            <ellipse rx="17" ry="6.5" fill="none" stroke="#38bdf8" stroke-width="1.4" transform="rotate(120)"/>
            <circle r="3" fill="#38bdf8"/>
          </g>
        </g>

        <!-- TypeScript Tile -->
        <g transform="translate(188, 0)">
          <rect width="78" height="64" rx="14" fill="url(#chipBg)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
          <rect x="22" y="17" width="34" height="30" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="39" y="38" class="font-name" font-size="15" fill="#38bdf8" text-anchor="middle">TS</text>
        </g>
      </g>

    </g>

    <!-- Outer 1.5px Precision Shimmer Border -->
    <rect class="shimmer-border" x="431.5" y="230.5" width="1057" height="619" rx="32" fill="none" stroke="url(#glassBorder)" stroke-width="1.5"/>

  </g>
</svg>
